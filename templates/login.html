<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | SEKU Smart Gate</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* institutional system fonts - fast & offline friendly */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }

        /* SEKU Official Colors */
        :root {
            --seku-green: #006b35;
        }

        .text-seku-green { color: var(--seku-green); }
        .bg-seku-green { background-color: var(--seku-green); }
        
        /* Smooth transitions for inputs */
        input:focus {
            border-color: var(--seku-green) !important;
            box-shadow: 0 0 0 4px rgba(0, 107, 53, 0.1) !important;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-100 via-white to-green-50">

    <div class="w-full max-w-md px-6">

        <div class="text-center mb-8">
            <img src="{{ url_for('static', filename='seku_logo.png') }}" 
                 onerror="this.src='https://via.placeholder.com/80?text=SEKU'"
                 class="w-20 h-20 mx-auto mb-4 object-contain">
            
            <h1 class="text-3xl font-black text-gray-900 tracking-tight">
                SEKU<span class="text-seku-green">SMARTGATE</span>
            </h1>
            <p class="text-gray-500 text-xs font-bold uppercase tracking-[0.2em] mt-1">Admin Control Panel</p>
        </div>

        <div class="bg-white border border-gray-200 p-10 rounded-[2.5rem] shadow-xl shadow-green-900/5 relative overflow-hidden">
            
            <div class="absolute top-0 left-0 right-0 h-1.5 bg-seku-green"></div>

            <div class="text-center mb-8">
                <div class="bg-green-50 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-green-100">
                    <i class="fas fa-shield-halved text-2xl text-seku-green"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">Secure Access</h2>
                <p class="text-gray-400 text-sm mt-1">Enter your credentials to manage the gate</p>
            </div>

            {% if error %}
            <div class="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 rounded-xl text-sm mb-6 flex items-center animate-pulse">
                <i class="fas fa-exclamation-circle mr-3"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="{{ url_for('login') }}" method="POST" class="space-y-5" autocomplete="off">

                <div>
                    <label class="block text-gray-700 text-xs font-bold uppercase tracking-widest mb-2 ml-1">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400">
                            <i class="fas fa-user-circle"></i>
                        </span>
                        <input type="text" name="username" required 
                            class="block w-full pl-11 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-2xl text-gray-900 placeholder-gray-400 outline-none transition-all" 
                            placeholder="Admin username" autocomplete="off">
                    </div>
                </div>

                <div>
                    <label class="block text-gray-700 text-xs font-bold uppercase tracking-widest mb-2 ml-1">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-400">
                            <i class="fas fa-fingerprint"></i>
                        </span>
                        <input id="passwordField" type="password" name="password" required 
                            class="block w-full pl-11 pr-12 py-3.5 bg-gray-50 border border-gray-200 rounded-2xl text-gray-900 placeholder-gray-400 outline-none transition-all" 
                            placeholder="Enter password" autocomplete="new-password">

                        <button type="button" onclick="togglePassword()" 
                              class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-seku-green transition-colors">
                            <i id="eyeIcon" class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" 
                    class="w-full bg-seku-green hover:bg-green-800 text-white font-bold py-4 rounded-2xl shadow-lg shadow-green-900/20 transition-all active:scale-[0.97] mt-2 flex items-center justify-center space-x-2">
                    <span>Unlock System</span>
                    <i class="fas fa-arrow-right text-sm"></i>
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-gray-100 text-center">
                <a href="{{ url_for('portal') }}" class="group text-gray-400 hover:text-seku-green font-semibold text-sm transition-all inline-flex items-center">
                    <i class="fas fa-chevron-left mr-2 group-hover:-translate-x-1 transition-transform"></i> 
                    Return to Terminal
                </a>
            </div>

        </div>

        <p class="text-center text-gray-400 text-[10px] mt-10 uppercase tracking-[0.3em]">
            © 2026 South Eastern Kenya University <br>
            <span class="text-gray-300">Security Engineering Dept</span>
        </p>

    </div>

    <script>
        function togglePassword() {
            const field = document.getElementById("passwordField");
            const icon = document.getElementById("eyeIcon");

            if (field.type === "password") {
                field.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                field.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        // Auto-clear fields on load to ensure no browser "ghosting"
        window.onload = () => {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                if(input.name !== 'username') input.value = '';
            });
        };
    </script>

</body>
</html>
